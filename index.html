<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Hardwood GM</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Archivo:wght@400;500;600;700&family=Big+Shoulders+Display:wght@600;800;900&display=swap" rel="stylesheet">
<style>
/* Layout idea: one phone column that reads like a box score. A sticky scoreboard header, heavy rules instead of
   cards, a bottom tab bar, and the whole interface takes its accent from the team you run. */
:root {
	--paper: #f2f3ef; --card: #ffffff; --ink: #14171c; --mute: #5f6670; --rule: #d3d6d0; --rule-strong: #14171c;
	--accent: #ce1141; --on-accent: #ffffff; --accent-text: #b50e39;
	--good: #17784a; --bad: #b93323;
	--f-display: "Big Shoulders Display", "Arial Narrow", "Helvetica Neue", sans-serif;
	--f-body: "Archivo", system-ui, -apple-system, "Segoe UI", sans-serif;
	color-scheme: light;
}
@media (prefers-color-scheme: dark) {
	:root:not([data-theme="light"]) { --paper: #101317; --card: #191d23; --ink: #eceee8; --mute: #9aa1ab; --rule: #2b3139; --rule-strong: #eceee8; --good: #55c891; --bad: #ff8271; color-scheme: dark; }
}
:root[data-theme="dark"] { --paper: #101317; --card: #191d23; --ink: #eceee8; --mute: #9aa1ab; --rule: #2b3139; --rule-strong: #eceee8; --good: #55c891; --bad: #ff8271; color-scheme: dark; }
* { box-sizing: border-box; }
html, body { height: 100%; margin: 0; }
body { background: var(--paper); color: var(--ink); font: 400 15px/1.4 var(--f-body); font-variant-numeric: tabular-nums; -webkit-text-size-adjust: 100%; }
button, select, input { font: inherit; color: inherit; }
button { cursor: pointer; }
:focus-visible { outline: 3px solid var(--accent-text); outline-offset: 2px; }
#app { max-width: 720px; margin: 0 auto; min-height: 100%; display: flex; flex-direction: column; }
.d { font-family: var(--f-display); font-weight: 900; text-transform: uppercase; letter-spacing: .01em; line-height: .95; }
.mute { color: var(--mute); }
.good { color: var(--good); } .bad { color: var(--bad); }
/* scoreboard header */
.top { position: sticky; top: 0; z-index: 5; background: var(--paper); border-bottom: 3px solid var(--rule-strong); display: flex; align-items: center; gap: 10px; padding: 10px 16px; }
.top .who { flex: 1; min-width: 0; }
.top .rec { font-size: 30px; }
.top .ph { font-size: 12px; color: var(--mute); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.play { background: var(--accent); color: var(--on-accent); border: 0; border-radius: 4px; padding: 0 18px; min-height: 48px; font-family: var(--f-display); font-weight: 900; font-size: 24px; text-transform: uppercase; letter-spacing: .03em; }
.play:active { transform: translateY(1px); }
main { flex: 1; padding: 14px 16px 96px; display: flex; flex-direction: column; gap: 18px; }
h1 { font-size: 46px; margin: 0; text-wrap: balance; }
h2 { font-size: 26px; margin: 0; border-bottom: 2px solid var(--rule-strong); padding-bottom: 4px; display: flex; justify-content: space-between; align-items: baseline; gap: 8px; }
h2 small { font: 500 12px var(--f-body); color: var(--mute); text-transform: none; letter-spacing: 0; }
section { display: flex; flex-direction: column; gap: 8px; }
p { margin: 0; max-width: 65ch; }
/* bottom tabs */
.tabs { position: fixed; left: 0; right: 0; bottom: 0; z-index: 6; background: var(--card); border-top: 1px solid var(--rule); display: flex; justify-content: center; padding-bottom: env(safe-area-inset-bottom); }
.tabs div { display: flex; width: 100%; max-width: 720px; }
.tabs button { flex: 1; background: none; border: 0; border-top: 4px solid transparent; min-height: 54px; font-family: var(--f-display); font-weight: 800; font-size: 17px; text-transform: uppercase; letter-spacing: .04em; color: var(--mute); }
.tabs button[aria-current="true"] { color: var(--ink); border-top-color: var(--accent); }
/* chips */
.chips { display: flex; gap: 6px; flex-wrap: wrap; }
.chip { background: none; border: 1.5px solid var(--rule); border-radius: 999px; padding: 0 14px; min-height: 38px; font-weight: 600; font-size: 13px; }
.chip[aria-pressed="true"] { background: var(--ink); color: var(--paper); border-color: var(--ink); }
/* tables */
.scroll { overflow-x: auto; margin: 0 -16px; padding: 0 16px; }
table { border-collapse: collapse; width: 100%; font-size: 14px; }
th { font: 600 11px var(--f-body); text-transform: uppercase; letter-spacing: .06em; color: var(--mute); text-align: right; padding: 6px 7px; border-bottom: 1px solid var(--rule-strong); white-space: nowrap; }
td { text-align: right; padding: 0 7px; height: 44px; border-bottom: 1px solid var(--rule); white-space: nowrap; }
th:first-child, td:first-child { text-align: left; position: sticky; left: 0; background: var(--paper); padding-left: 0; }
tr.me td { background: color-mix(in srgb, var(--accent) 12%, var(--paper)); }
tr.cut td { border-bottom: 2px solid var(--rule-strong); }
tr[data-a] { cursor: pointer; }
.nm { font-weight: 600; display: block; max-width: 46vw; overflow: hidden; text-overflow: ellipsis; }
.sub { font-size: 11.5px; color: var(--mute); display: block; }
.ovr { font-family: var(--f-display); font-weight: 900; font-size: 22px; }
.tag.ok { background: var(--good); }
.tag.no { background: var(--mute); }
.dv { display: inline-block; margin-left: 4px; font-family: Archivo, system-ui, sans-serif; font-size: 12px; font-weight: 800; vertical-align: middle; }
.dv.up { color: var(--good); }
.stepn { display: inline-flex; align-items: center; justify-content: center; width: 1.25em; height: 1.25em; margin-right: .35em; border-radius: 50%; background: var(--accent); color: #fff; font-size: .8em; vertical-align: .08em; }
.sortbar { display: flex; gap: 6px; align-items: center; overflow-x: auto; white-space: nowrap; padding: 2px 0 6px; scrollbar-width: none; }
.sortbar::-webkit-scrollbar { display: none; }
.sortbar > span { font-size: 11px; font-weight: 700; letter-spacing: .06em; text-transform: uppercase; color: var(--mute); min-width: 34px; }
.sortbar .chip { flex: none; }
.clock.mine { border: 2px solid var(--accent); border-radius: 6px; padding: 10px 12px; }
.linkbtn { background: none; border: 0; padding: 0; min-height: 0; color: var(--accent); font: inherit; font-weight: 700; text-decoration: underline; cursor: pointer; }
.dv.dn { color: var(--bad); }
.capbar { position: relative; height: 14px; background: var(--rule); border-radius: 3px; margin: 14px 0 26px; }
.capbar i { position: absolute; left: 0; top: 0; bottom: 0; background: var(--accent); border-radius: 3px; max-width: 100%; }
.capbar b { position: absolute; top: -5px; bottom: -5px; width: 2px; background: var(--ink); }
.capbar b span { position: absolute; top: 26px; left: 1px; transform: translateX(-50%); font-size: 11px; font-weight: 700; color: var(--mute); white-space: nowrap; text-transform: uppercase; letter-spacing: .05em; }
.steps { display: flex; flex-wrap: wrap; gap: 6px; margin-bottom: 4px; }
.steps span { font-size: 12.5px; font-weight: 700; padding: 5px 9px; border-radius: 999px; border: 1.5px solid var(--rule); color: var(--mute); }
.steps span.done { color: var(--good); border-color: var(--good); }
.steps span.now { color: var(--paper); background: var(--ink); border-color: var(--ink); }
.tag { display: inline-block; font-size: 10.5px; font-weight: 700; padding: 1px 5px; border-radius: 3px; background: var(--bad); color: #fff; margin-left: 4px; vertical-align: 1px; }
.tag.q { background: var(--mute); }
.team { display: inline-flex; align-items: center; gap: 8px; }
.bdg { flex: none; }
/* rows & bits */
.kv { display: grid; grid-template-columns: repeat(3, 1fr); border-top: 1px solid var(--rule-strong); }
.kv div { padding: 8px 0; border-bottom: 1px solid var(--rule); }
.kv b { display: block; font-family: var(--f-display); font-weight: 900; font-size: clamp(19px, 6.6vw, 30px); line-height: 1; white-space: nowrap; }
.kv span { font-size: 11px; text-transform: uppercase; letter-spacing: .06em; color: var(--mute); }
.list { display: flex; flex-direction: column; }
.list > * { display: flex; justify-content: space-between; gap: 10px; align-items: center; min-height: 44px; padding: 6px 0; border-bottom: 1px solid var(--rule); }
.btn { background: var(--ink); color: var(--paper); border: 0; border-radius: 4px; min-height: 46px; padding: 0 16px; font-weight: 700; }
.btn.alt { background: none; color: var(--ink); border: 1.5px solid var(--ink); }
.btn.go { background: var(--accent); color: var(--on-accent); }
.btn:disabled { opacity: .4; cursor: not-allowed; }
.row { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; }
input[type="text"] { background: var(--card); border: 1.5px solid var(--rule); border-radius: 4px; min-height: 46px; padding: 0 10px; min-width: 0; flex: 1; }
input[type="color"] { width: 56px; min-height: 46px; padding: 2px; background: var(--card); border: 1.5px solid var(--rule); border-radius: 4px; }
.sg { display: grid; grid-template-columns: 1fr auto; gap: 4px 12px; align-items: center; font-variant-numeric: tabular-nums; }
.sg .w { font-weight: 800; }
select { background: var(--card); border: 1.5px solid var(--rule); border-radius: 4px; min-height: 46px; padding: 0 10px; max-width: 100%; }
.note { font-size: 13px; color: var(--mute); }
.recap { margin: 10px 0 14px; padding: 10px 12px; border-left: 3px solid var(--accent); background: rgba(0,0,0,.04); }
.recap b { display: block; font-size: 16px; line-height: 1.25; margin-bottom: 6px; }
.recap p { margin: 0 0 8px; font-size: 14px; line-height: 1.45; }
.recap p.note { margin: 0; font-size: 12px; }
.bar { height: 8px; background: var(--rule); border-radius: 2px; overflow: hidden; }
.bar i { display: block; height: 100%; background: var(--accent-text); }
.rt { display: grid; grid-template-columns: 158px 1fr 30px; gap: 8px; align-items: center; font-size: 13px; }
/* sheet */
.veil { position: fixed; inset: 0; z-index: 9; background: rgba(0, 0, 0, .5); display: flex; align-items: flex-end; justify-content: center; }
.sheet { background: var(--paper); width: 100%; max-width: 720px; max-height: 88%; overflow-y: auto; border-top: 5px solid var(--accent); padding: 16px 16px calc(20px + env(safe-area-inset-bottom)); display: flex; flex-direction: column; gap: 12px; }
.sheet > * { flex: none; }
.sheet .btn { width: 100%; }
.sheet.full { height: 100%; max-height: 100%; }
.thb { background: none; border: 0; padding: 8px 2px; min-height: 36px; font: inherit; color: inherit; text-transform: inherit; letter-spacing: inherit; }
.thb[aria-pressed="true"] { color: var(--ink); text-decoration: underline; text-underline-offset: 3px; }
.toast { position: fixed; left: 50%; bottom: 72px; transform: translateX(-50%); z-index: 8; background: var(--ink); color: var(--paper); padding: 10px 16px; border-radius: 4px; font-weight: 600; font-size: 14px; max-width: 92%; text-align: center; }
/* start screen */
.pick { display: grid; grid-template-columns: repeat(auto-fill, minmax(96px, 1fr)); gap: 6px; }
.pick button { background: var(--card); border: 1.5px solid var(--rule); border-radius: 4px; min-height: 64px; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 2px; font-size: 12px; font-weight: 600; padding: 6px 2px; }
.pick button[aria-pressed="true"] { border-color: var(--ink); box-shadow: inset 0 0 0 2px var(--ink); }
@media (prefers-reduced-motion: no-preference) { .sheet { animation: up .18s ease-out; } @keyframes up { from { transform: translateY(24px); opacity: .6; } } }
</style>
</head>
<body>
<div id="app"><main><h1 class="d">Hardwood GM</h1><p class="mute">Loading rosters…</p></main></div>
<script src="app.js"></script>
</body>
</html>
